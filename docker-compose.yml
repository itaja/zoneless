services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=zoneless
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      zoneless-network:
        aliases:
          - mongo

  # Zoneless API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zoneless?directConnection=true
      - API_PORT=3333
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zoneless-network

  # Zoneless Dashboard (Angular + nginx), proxies /api/ and /v1/ to the API
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      - API_PORT=3333
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      - api
    networks:
      - zoneless-network

volumes:
  mongodb_data:
    driver: local

networks:
  zoneless-network:
    driver: bridge
